<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable</title>
  <style>
    :root { --bg: #f5f7fa; --fg: #1f2933; --accent: #1565c0; --muted: #52606d; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111827; --fg: #e5e7eb; --accent: #60a5fa; --muted: #9ca3af; }
    }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--fg); text-align: center; padding: 16px; }
    .code { font-size: 6rem; font-weight: 700; color: var(--accent); margin: 0; }
    p { color: var(--muted); }
    a { display: inline-block; margin-top: 16px; padding: 10px 20px; border-radius: 8px;
        background: var(--accent); color: #fff; text-decoration: none; }
  </style>
</head>
<body>
  <div>
    <p class="code">404</p>
    <h1>Page introuvable</h1>
    <p>La page demandée n'existe pas ou a été déplacée.</p>
    <a href="/reseaux-informatiques/">Retour à l'accueil</a>
  </div>
</body>
</html>
