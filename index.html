<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réseaux informatiques</title>
  <style>
    :root { --bg: #f5f7fa; --fg: #1f2933; --accent: #1565c0; --card: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111827; --fg: #e5e7eb; --accent: #60a5fa; --card: #1f2937; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--fg); line-height: 1.6; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
    h1 { color: var(--accent); margin-top: 0; }
    .card { background: var(--card); border-radius: 12px; padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  </style>
</head>
<body>
  <main>
    <h1>Réseaux informatiques</h1>
    <div class="card">
      <p>Bienvenue ! Les cours et exercices sur les réseaux informatiques seront publiés ici.</p>
    </div>
  </main>
</body>
</html>
